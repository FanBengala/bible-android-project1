<title>Աստվածաշունչ</title>
<style>

<style>
  :root {
    --bg: #edf1ec; --panel: #f8faf7; --ink: #16312b; --muted: #55695f; --line: #cfdad3;
    --primary: #1f4d41; --primary-text: #ffffff; --accent: #9b1b3a; --track: #d8e2dc; --cell: #e1e9e4;
    --hl: #fbe9b7; --sel: #dbe9e2; --focus: #9b1b3a;

  .btn.danger { color: var(--accent); border-color: var(--accent); }

  .card.compact .snum { font-size: 28px; }
  .card.compact .srow { gap: 8px; }
  .card.compact .week { margin: 8px 0 8px; gap: 4px; }

  .card.compact .wd i { width: 24px; height: 24px; line-height: 24px; font-size: 13px; }

  .bar { position: relative; height: 16px; border-radius: 999px; background: var(--track); margin: 12px 0 10px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--primary); transition: width .35s ease; }
  .bar b { position: absolute; top: -5px; width: 3px; height: 26px; border-radius: 2px; background: var(--accent); display: none; }

  .ref { font-family: "Noto Serif Armenian", Georgia, serif; font-weight: 700; font-size: clamp(26px, 7vw, 38px); line-height: 1.2; margin: 8px 0 2px; overflow-wrap: anywhere; }
  .verses p { font-family: "Noto Serif Armenian", Georgia, serif; font-size: 18px; line-height: 1.7; margin: 8px 0; }

  .flame { font-size: 40px; line-height: 1; }
  .snum { font-family: "Noto Serif Armenian", Georgia, serif; font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 0 6px; text-align: center; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .wd i { display: block; width: 32px; height: 32px; border-radius: 50%; background: var(--cell); font-style: normal; line-height: 32px; font-size: 16px; font-weight: 700; color: var(--primary-text); }

  .vb { border-top: 1px solid var(--line); padding: 12px 0 6px; }
  .vb:first-of-type { border-top: 0; }
  .vhead { font-family: "Noto Serif Armenian", Georgia, serif; font-size: 17px; }
  .vtext { font-family: "Noto Serif Armenian", Georgia, serif; font-size: 18px; line-height: 1.7; margin: 6px 0 10px; }

  .vn { color: var(--accent); font-size: .72em; font-weight: 700; margin-right: 4px; font-family: "Noto Sans Armenian", system-ui, sans-serif; }

  .sheet div { max-width: 720px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  .sheet .btn { flex: 1; }

  input[type=search], input[type=date], input[type=text] { font: inherit; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  input[type=date] { width: auto; }
  textarea { font: inherit; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); resize: vertical; min-height: 70px; }
  .pnames { margin: 6px 0 12px; padding-left: 20px; font-family: "Noto Serif Armenian", Georgia, serif; font-size: 17px; line-height: 1.6; }
  .res { border-bottom: 1px solid var(--line); padding: 12px 2px; cursor: pointer; }
  .res b { font-family: "Noto Serif Armenian", Georgia, serif; }
  .res p { margin: 4px 0 0; font-family: "Noto Serif Armenian", Georgia, serif; font-size: 16px; line-height: 1.6; }
  mark { background: var(--hl); color: inherit; border-radius: 3px; }
  .pitem { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .pitem:last-child { border-bottom: 0; }
  .ptext { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: "Noto Serif Armenian", Georgia, serif; font-size: 17px; line-height: 1.5; }
  .pitem .ibtn { height: 36px; min-width: 36px; padding: 0 8px; }
  .ibtn.warn { color: var(--accent); border-color: var(--accent); }
  .note { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .center { text-align: center; padding: 30px 6px; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>

</div>

            var vv = m[3] ? +m[3] : 0;
            var r = el('div', 'res'); r.appendChild(el('b', null, 'Բացել՝ ' + refText(i, ch, vv)));
            (function (i, ch, vv) { r.addEventListener('click', function () { go('read/' + i + '/' + ch + (vv ? '?s=' + vv : '')); }); })(i, ch, vv);
            out.appendChild(r);
          }
          break;
        }
      }
    }
    var letters = Array.from(q.replace(/[՛՜՞՝՚]/g, '')); var pat = letters.map(function (c) { return escRe(c); }).join('[՛՜՞՚]*');
    var re; try { re = new RegExp(pat, 'i'); } catch (e) { return; }
    var n = 0, MAX = 150;
    for (var b = 0; b < 66 && n < MAX; b++)
      for (var c = 0; c < BIBLE[b].length && n < MAX; c++)
        for (var k = 0; k < BIBLE[b][c].length && n < MAX; k++) {
          var t = BIBLE[b][c][k], mm = t && re.exec(t);
          if (!mm) continue;
          n++;
          var row = el('div', 'res'); row.appendChild(el('b', null, refText(b, c + 1, k + 1)));
          var p = el('p');
          var s0 = Math.max(0, mm.index - 50), e0 = Math.min(t.length, mm.index + mm[0].length + 90);
          if (s0 > 0) p.appendChild(document.createTextNode('…'));
          p.appendChild(document.createTextNode(t.slice(s0, mm.index)));
          var mk = el('mark', null, mm[0]); p.appendChild(mk);
          p.appendChild(document.createTextNode(t.slice(mm.index + mm[0].length, e0) + (e0 < t.length ? '…' : '')));
          row.appendChild(p);
          (function (b, c, k) { row.addEventListener('click', function () { go('read/' + b + '/' + (c + 1) + '?s=' + (k + 1)); }); })(b, c, k);
          out.appendChild(row);
        }
    if (!n) out.appendChild(el('p', 'note', 'Ոչինչ չգտնվեց։'));
    else if (n >= MAX) out.appendChild(el('p', 'note', 'Ցուցադրված են առաջին ' + MAX + ' արդյունքները։ Ճշգրտեք որոնումը։'));
  }
  inp.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 250); });
  if (q0) run(); else inp.focus();
}

// ---------- bookmarks ----------
function viewMarks(v) {
  setChrome('Նշումներ', { tab: 'marks' });
  var keys = Object.keys(S.marks).map(function (k) { return k.split(':').map(Number); });
  keys.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1] || a[2] - b[2]; });
  if (!keys.length) { var c = el('div', 'center muted', 'Նշումներ դեռ չկան։ Կարդալիս սեղմեք համարի վրա՝ նշելու համար։'); v.appendChild(c); return; }
  keys.forEach(function (k) {
    var t = BIBLE[k[0]] && BIBLE[k[0]][k[1] - 1] && BIBLE[k[0]][k[1] - 1][k[2] - 1];
    if (!t) return;
    var row = el('div', 'res'); row.appendChild(el('b', null, refText(k[0], k[1], k[2]))); row.appendChild(el('p', null, t));
    row.addEventListener('click', function () { go('read/' + k[0] + '/' + k[1] + '?s=' + k[2]); });
    v.appendChild(row);
  });
}

// ---------- prayer list ----------
function viewPrayer(v) {
  setChrome('Աղոթքի ցանկ', { tab: 'today', back: function () { go('today'); } });
  var card = el('div', 'card');
  card.appendChild(el('p', 'muted', 'Գրեք այն անունները կամ խնդրանքները, որոնց համար ուզում եք աղոթել։ Կարող եք մի քանի անուն գրել՝ յուրաքանչյուրը նոր տողում։'));
  var inp = el('textarea'); inp.rows = 3; inp.placeholder = 'Անուն կամ խնդրանք։ Յուրաքանչյուր տողը՝ առանձին կետ'; inp.maxLength = 3000; inp.setAttribute('aria-label', 'Անուն կամ խնդրանք');
  function add() {
    var lines = inp.value.split(/\r?\n/).map(function (x) { return x.trim().slice(0, 300); }).filter(Boolean); if (!lines.length) return;
    lines.forEach(function (t, k) { S.prayers.push({ id: Date.now() * 1000 + k * 7 + Math.floor(Math.random() * 7), t: t }); });
    save(); editId = delId = null; route();
    setTimeout(function () { var i = document.querySelector('#view textarea'); if (i) i.focus(); }, 0);
  }
  var row = el('div', 'row'); row.style.marginTop = '10px';
  row.appendChild(btn('Ավելացնել', 'btn primary grow', add));
  card.appendChild(inp); card.appendChild(row); v.appendChild(card);

  var list = el('div', 'card');
  list.appendChild(el('h2', null, 'Ցանկ' + (S.prayers.length ? ' (' + S.prayers.length + ')' : '')));
  if (!S.prayers.length) list.appendChild(el('p', 'muted', 'Ցանկը դեռ դատարկ է։'));
  S.prayers.forEach(function (it, idx) {
    var r = el('div', 'pitem');
    if (editId === it.id) {
      var ei = el('input'); ei.type = 'text'; ei.value = it.t; ei.maxLength = 300; ei.setAttribute('aria-label', 'Խմբագրել'); ei.style.flex = '1';
      var saveEdit = function () { var t = ei.value.trim(); if (t) { it.t = t; save(); } editId = null; route(); };
      ei.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveEdit(); else if (e.key === 'Escape') { editId = null; route(); } });
      r.appendChild(ei); r.appendChild(btn('Պահել', 'btn small', saveEdit));
      setTimeout(function () { ei.focus(); ei.setSelectionRange(ei.value.length, ei.value.length); }, 0);
    } else {
      r.appendChild(el('span', 'ptext', it.t));
      var ed = btn('✎', 'ibtn', function () { editId = it.id; delId = null; route(); }); ed.setAttribute('aria-label', 'Խմբագրել');
      var asking = delId === it.id;
      var dl = btn(asking ? 'Ջնջե՞լ' : '✕', 'ibtn' + (asking ? ' warn' : ''), function () {
        if (delId === it.id) { S.prayers.splice(idx, 1); save(); delId = null; route(); return; }
        delId = it.id; route();
        setTimeout(function () { if (delId === it.id && (location.hash.indexOf('#/prayer') === 0)) { delId = null; route(); } }, 3000);
      });
      dl.setAttribute('aria-label', 'Ջնջել'); r.appendChild(ed); r.appendChild(dl);
    }
    list.appendChild(r);
  });
  v.appendChild(list);
  v.appendChild(el('p', 'note', 'Ցանկը պահվում է միայն այս սարքում։'));
}

// ---------- events ----------
$('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) go(b.dataset.go); });
$('theme').addEventListener('click', function () { S.theme = S.theme === 'auto' ? 'light' : (S.theme === 'light' ? 'dark' : 'auto'); applyTheme(); save(); });
$('fMinus').addEventListener('click', function () { S.fs = clamp(S.fs - 2, 14, 34); applyFont(); save(); });
$('fPlus').addEventListener('click', function () { S.fs = clamp(S.fs + 2, 14, 34); applyFont(); save(); });
$('shClose').addEventListener('click', closeSheet);
$('shMark').addEventListener('click', function () {
  if (!selVerse) return;
  var k = selVerse.b + ':' + selVerse.c + ':' + selVerse.n;
  if (S.marks[k]) { delete S.marks[k]; selVerse.node.classList.remove('bm'); } else { S.marks[k] = 1; selVerse.node.classList.add('bm'); }
  save(); closeSheet();
});
$('shCopy').addEventListener('click', function () {
  if (!selVerse) return;
  var txt = BIBLE[selVerse.b][selVerse.c - 1][selVerse.n - 1] + ' (' + refText(selVerse.b, selVerse.c, selVerse.n) + ')';
  var done = function () { $('shCopy').textContent = 'Պատճենվեց'; setTimeout(function () { $('shCopy').textContent = 'Պատճենել'; closeSheet(); }, 700); };
  try { navigator.clipboard.writeText(txt).then(done, done); } catch (e) { done(); }
});
$('file').addEventListener('change', function (e) { var f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
window.addEventListener('hashchange', route);
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeSheet(); });

load();
if (!S.seed) { S.seed = ((Math.random() * 4294967296) >>> 0) || 1; save(); }
applyTheme(); applyFont();
loadBible().then(function (n) { if (n) useBible(n); route(); });
})();
</script>
