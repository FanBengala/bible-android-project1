<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Աստվածաշունչ</title>
<style>
@font-face{font-family:"Noto Serif Armenian";font-weight:400;font-display:swap;src:url(fonts/noto-serif-armenian-armenian-400-normal.woff2) format("woff2");}
@font-face{font-family:"Noto Serif Armenian";font-weight:700;font-display:swap;src:url(fonts/noto-serif-armenian-armenian-700-normal.woff2) format("woff2");}
@font-face{font-family:"Noto Sans Armenian";font-weight:400;font-display:swap;src:url(fonts/noto-sans-armenian-armenian-400-normal.woff2) format("woff2");}
@font-face{font-family:"Noto Sans Armenian";font-weight:600;font-display:swap;src:url(fonts/noto-sans-armenian-armenian-600-normal.woff2) format("woff2");}
</style>
<style>
  :root {
    --bg: #edf1ec; --panel: #f8faf7; --ink: #16312b; --muted: #55695f; --line: #cfdad3;
    --primary: #1f4d41; --primary-text: #ffffff; --accent: #9b1b3a; --track: #d8e2dc; --cell: #e1e9e4;
    --hl: #fbe9b7; --sel: #dbe9e2; --focus: #9b1b3a;
    --fs: 20px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1916; --panel: #17251f; --ink: #e6f0eb; --muted: #93a9a0; --line: #28403a;
      --primary: #5fb597; --primary-text: #0a1713; --accent: #ec6b88; --track: #243630; --cell: #20332c;
      --hl: #4a3f1c; --sel: #1f3a31; --focus: #ec6b88;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1916; --panel: #17251f; --ink: #e6f0eb; --muted: #93a9a0; --line: #28403a;
    --primary: #5fb597; --primary-text: #0a1713; --accent: #ec6b88; --track: #243630; --cell: #20332c;
    --hl: #4a3f1c; --sel: #1f3a31; --focus: #ec6b88;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans Armenian", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3 { font-family: "Noto Serif Armenian", Georgia, "Times New Roman", serif; margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  #app { max-width: 720px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  .top h1 { font-size: 19px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ibtn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; min-width: 40px; height: 40px; padding: 0 10px; }
  main { flex: 1; padding: 16px 14px 96px; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabs div { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  .tabs button { border: 0; background: none; padding: 12px 2px; font-size: 13px; color: var(--muted); }
  .tabs button[aria-current="page"] { color: var(--primary); font-weight: 600; box-shadow: inset 0 3px 0 var(--accent); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--line); background: transparent; border-radius: 14px; padding: 11px 16px; }
  .btn.primary { background: var(--primary); color: var(--primary-text); border-color: var(--primary); font-weight: 600; }
  .btn.primary.done { background: transparent; color: var(--primary); }
  .btn.danger { color: var(--accent); border-color: var(--accent); }
  .grow { flex: 1 1 140px; }

  .card.compact { padding: 12px 14px; }
  .card.compact .flame { font-size: 26px; }
  .card.compact .snum { font-size: 28px; }
  .card.compact .srow { gap: 8px; }
  .card.compact .week { margin: 8px 0 8px; gap: 4px; }
  .card.compact .wd { gap: 2px; }
  .card.compact .wd i { width: 24px; height: 24px; line-height: 24px; font-size: 13px; }
  .card.compact .wd .small { font-size: 12px; }
  .card.compact .big { font-size: 20px; }
  .card.compact .bar { height: 10px; margin: 6px 0 6px; }
  .big { font-family: "Noto Serif Armenian", Georgia, serif; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .big small { font-size: 15px; font-weight: 400; color: var(--muted); }
  .bar { position: relative; height: 16px; border-radius: 999px; background: var(--track); margin: 12px 0 10px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--primary); transition: width .35s ease; }
  .bar b { position: absolute; top: -5px; width: 3px; height: 26px; border-radius: 2px; background: var(--accent); display: none; }

  .ref { font-family: "Noto Serif Armenian", Georgia, serif; font-weight: 700; font-size: clamp(26px, 7vw, 38px); line-height: 1.2; margin: 8px 0 2px; overflow-wrap: anywhere; }
  .verses p { font-family: "Noto Serif Armenian", Georgia, serif; font-size: 18px; line-height: 1.7; margin: 8px 0; }
  .srow { display: flex; align-items: center; gap: 12px; }
  .flame { font-size: 40px; line-height: 1; }
  .snum { font-family: "Noto Serif Armenian", Georgia, serif; font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 0 6px; text-align: center; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .wd i { display: block; width: 32px; height: 32px; border-radius: 50%; background: var(--cell); font-style: normal; line-height: 32px; font-size: 16px; font-weight: 700; color: var(--primary-text); }
  .wd.ok i { background: var(--primary); }
  .wd.tod i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  .wd.fut { opacity: .55; }
  .vb { border-top: 1px solid var(--line); padding: 12px 0 6px; }
  .vb:first-of-type { border-top: 0; }
  .vhead { font-family: "Noto Serif Armenian", Georgia, serif; font-size: 17px; }
  .vtext { font-family: "Noto Serif Armenian", Georgia, serif; font-size: 18px; line-height: 1.7; margin: 6px 0 10px; }
  .btn.small { padding: 7px 12px; font-size: 14px; }
  .vn { color: var(--accent); font-size: .72em; font-weight: 700; margin-right: 4px; font-family: "Noto Sans Armenian", system-ui, sans-serif; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
  .grid button { padding: 0; aspect-ratio: 1; border-radius: 9px; font-size: 11px; line-height: 1; border: 1.5px solid transparent; background: var(--cell); min-width: 0; font-variant-numeric: tabular-nums; }
  .grid button.done { background: var(--primary); color: var(--primary-text); }
  .grid button.missed { border-color: var(--accent); }
  .grid button.today { box-shadow: inset 0 -4px 0 var(--accent); }
  .grid button.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .sw { display: inline-block; width: 13px; height: 13px; border-radius: 4px; background: var(--cell); border: 1.5px solid transparent; vertical-align: -2px; margin-right: 6px; }
  .sw.done { background: var(--primary); } .sw.missed { border-color: var(--accent); } .sw.today { box-shadow: inset 0 -4px 0 var(--accent); }

  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .books button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px 14px; }
  .chap { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
  .chap button { height: 48px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; font-variant-numeric: tabular-nums; }
  h3.sec { font-size: 16px; color: var(--muted); font-weight: 600; margin: 4px 2px 10px; }

  .text { font-family: "Noto Serif Armenian", Georgia, serif; font-size: var(--fs); line-height: 1.75; }
  .text .v { padding: 1px 2px; border-radius: 6px; cursor: pointer; }
  .text .v.hl { background: var(--hl); }
  .text .v.sel { background: var(--sel); box-shadow: 0 0 0 2px var(--primary); }
  .text .v.bm .vn::after { content: "★"; color: var(--accent); margin-left: 2px; }
  .pager { display: flex; gap: 10px; margin-top: 22px; }
  .pager button { flex: 1; }

  .sheet { position: fixed; left: 0; right: 0; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); z-index: 7; padding: 0 14px; }
  .sheet div { max-width: 720px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  .sheet .btn { flex: 1; }

  input[type=search], input[type=date], input[type=text], input[type=time] { font: inherit; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  input[type=date], input[type=time] { width: auto; }
  textarea { font: inherit; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); resize: vertical; min-height: 70px; }
  .pnames { margin: 6px 0 12px; padding-left: 20px; font-family: "Noto Serif Armenian", Georgia, serif; font-size: 17px; line-height: 1.6; }
  .res { border-bottom: 1px solid var(--line); padding: 12px 2px; cursor: pointer; }
  .res b { font-family: "Noto Serif Armenian", Georgia, serif; }
  .res p { margin: 4px 0 0; font-family: "Noto Serif Armenian", Georgia, serif; font-size: 16px; line-height: 1.6; }
  mark { background: var(--hl); color: inherit; border-radius: 3px; }
  .pitem { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .pitem:last-child { border-bottom: 0; }
  .ptext { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: "Noto Serif Armenian", Georgia, serif; font-size: 17px; line-height: 1.5; }
  .pitem .ibtn { height: 36px; min-width: 36px; padding: 0 8px; }
  .ibtn.warn { color: var(--accent); border-color: var(--accent); }
  .note { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .center { text-align: center; padding: 30px 6px; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ibtn" id="back" hidden aria-label="Հետ">‹</button>
    <h1 id="title">Աստվածաշունչ</h1>
    <button class="ibtn" id="fMinus" hidden aria-label="Փոքրացնել տառաչափը">A−</button>
    <button class="ibtn" id="fPlus" hidden aria-label="Մեծացնել տառաչափը">A+</button>
    <button class="ibtn" id="theme" aria-label="Փոխել թեման">◐</button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"><div>
    <button data-go="today">Այսօր</button>
    <button data-go="read">Կարդալ</button>
    <button data-go="search">Որոնում</button>
    <button data-go="marks">Նշումներ</button>
  </div></nav>
  <div class="sheet" id="sheet" hidden><div>
    <button class="btn" id="shMark">Նշել ★</button>
    <button class="btn" id="shCopy">Պատճենել</button>
    <button class="btn" id="shClose">Փակել</button>
  </div></div>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>

function prevCh(b, c) { if (c > 1) return [b, c - 1]; if (b > 0) return [b - 1, BIBLE[b - 1].length]; return null; }

// ---------- search ----------
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function viewSearch(v, q0) {
  setChrome('Որոնում', { tab: 'search' });
  var inp = el('input'); inp.type = 'search'; inp.placeholder = 'Բառ կամ հասցե, օր․ սէր կամ Հովհաննես 3:16'; inp.value = q0;
  inp.setAttribute('aria-label', 'Որոնում');
  var out = el('div'); out.style.marginTop = '12px';
  v.appendChild(inp); v.appendChild(out);
  var timer = null;
  function run() {
    out.innerHTML = '';
    var q = inp.value.trim();
    if (q.length < 2) { out.appendChild(el('p', 'note', 'Գրեք առնվազն 2 տառ։')); return; }
    var m = /^(.+?)\s+(\d+)(?::(\d+))?$/.exec(q);
    if (m) {
      var fold = function (x) { return x.toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ').replace(/է/g, 'ե').replace(/յ/g, 'հ'); };
      var nm = fold(m[1]);
      for (var i = 0; i < 66; i++) {
        var hn = fold(HY[i]);
        if (hn === nm || hn.indexOf(nm) === 0 || hn.replace(/^[աբգ] /, '').indexOf(nm) === 0) {
          var ch = +m[2];
          if (ch >= 1 && ch <= BIBLE[i].length) {
            var vv = m[3] ? +m[3] : 0;
            var r = el('div', 'res'); r.appendChild(el('b', null, 'Բացել՝ ' + refText(i, ch, vv)));
            (function (i, ch, vv) { r.addEventListener('click', function () { go('read/' + i + '/' + ch + (vv ? '?s=' + vv : '')); }); })(i, ch, vv);
            out.appendChild(r);
          }
          break;
        }
      }
    }
    var letters = Array.from(q.replace(/[՛՜՞՝՚]/g, '')); var pat = letters.map(function (c) { return escRe(c); }).join('[՛՜՞՚]*');
    var re; try { re = new RegExp(pat, 'i'); } catch (e) { return; }
    var n = 0, MAX = 150;
    for (var b = 0; b < 66 && n < MAX; b++)
      for (var c = 0; c < BIBLE[b].length && n < MAX; c++)
        for (var k = 0; k < BIBLE[b][c].length && n < MAX; k++) {
          var t = BIBLE[b][c][k], mm = t && re.exec(t);
          if (!mm) continue;
          n++;
          var row = el('div', 'res'); row.appendChild(el('b', null, refText(b, c + 1, k + 1)));
          var p = el('p');
          var s0 = Math.max(0, mm.index - 50), e0 = Math.min(t.length, mm.index + mm[0].length + 90);
          if (s0 > 0) p.appendChild(document.createTextNode('…'));
          p.appendChild(document.createTextNode(t.slice(s0, mm.index)));
          var mk = el('mark', null, mm[0]); p.appendChild(mk);
          p.appendChild(document.createTextNode(t.slice(mm.index + mm[0].length, e0) + (e0 < t.length ? '…' : '')));
          row.appendChild(p);
          (function (b, c, k) { row.addEventListener('click', function () { go('read/' + b + '/' + (c + 1) + '?s=' + (k + 1)); }); })(b, c, k);
          out.appendChild(row);
        }
    if (!n) out.appendChild(el('p', 'note', 'Ոչինչ չգտնվեց։'));
    else if (n >= MAX) out.appendChild(el('p', 'note', 'Ցուցադրված են առաջին ' + MAX + ' արդյունքները։ Ճշգրտեք որոնումը։'));
  }
  inp.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 250); });
  if (q0) run(); else inp.focus();
}

      setTimeout(function () { ei.focus(); ei.setSelectionRange(ei.value.length, ei.value.length); }, 0);
    } else {
      r.appendChild(el('span', 'ptext', it.t));
      var ed = btn('✎', 'ibtn', function () { editId = it.id; delId = null; route(); }); ed.setAttribute('aria-label', 'Խմբագրել');
      var asking = delId === it.id;
      var dl = btn(asking ? 'Ջնջե՞լ' : '✕', 'ibtn' + (asking ? ' warn' : ''), function () {
        if (delId === it.id) { S.prayers.splice(idx, 1); save(); delId = null; route(); return; }
        delId = it.id; route();
        setTimeout(function () { if (delId === it.id && (location.hash.indexOf('#/prayer') === 0)) { delId = null; route(); } }, 3000);
      });
      dl.setAttribute('aria-label', 'Ջնջել'); r.appendChild(ed); r.appendChild(dl);
    }
    list.appendChild(r);
  });
  v.appendChild(list);
  v.appendChild(el('p', 'note', 'Ցանկը պահվում է միայն այս սարքում։'));
}

// ---------- events ----------
$('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) go(b.dataset.go); });
$('theme').addEventListener('click', function () { S.theme = S.theme === 'auto' ? 'light' : (S.theme === 'light' ? 'dark' : 'auto'); applyTheme(); save(); });
$('fMinus').addEventListener('click', function () { S.fs = clamp(S.fs - 2, 14, 34); applyFont(); save(); });
$('fPlus').addEventListener('click', function () { S.fs = clamp(S.fs + 2, 14, 34); applyFont(); save(); });
$('shClose').addEventListener('click', closeSheet);
$('shMark').addEventListener('click', function () {
  if (!selVerse) return;
  var k = selVerse.b + ':' + selVerse.c + ':' + selVerse.n;
  if (S.marks[k]) { delete S.marks[k]; selVerse.node.classList.remove('bm'); } else { S.marks[k] = 1; selVerse.node.classList.add('bm'); }
  save(); closeSheet();
});
$('shCopy').addEventListener('click', function () {
  if (!selVerse) return;
  var txt = BIBLE[selVerse.b][selVerse.c - 1][selVerse.n - 1] + ' (' + refText(selVerse.b, selVerse.c, selVerse.n) + ')';
  var done = function () { $('shCopy').textContent = 'Պատճենվեց'; setTimeout(function () { $('shCopy').textContent = 'Պատճենել'; closeSheet(); }, 700); };
  try { navigator.clipboard.writeText(txt).then(done, done); } catch (e) { done(); }
});
$('file').addEventListener('change', function (e) { var f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
window.addEventListener('hashchange', route);
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeSheet(); });

load();
if (!S.seed) { S.seed = ((Math.random() * 4294967296) >>> 0) || 1; save(); }
applyTheme(); applyFont();
loadBible().then(function (n) { if (n) useBible(n); route(); applyReminder(); });
})();
</script>
</body>
</html>
